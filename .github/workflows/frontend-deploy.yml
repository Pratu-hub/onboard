name: Frontend Deployment

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Only needed because you are using github_id_token / OIDC
      - name: Get GitHub OIDC token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      - name: Build and Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Rename your repo secret to this exact name if possible
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}

          action: upload
          app_location: frontend
          api_location: ""
          output_location: dist

          github_id_token: ${{ steps.idtoken.outputs.result }}

        env:
          VITE_B2C_TENANT: onboardin
          VITE_B2C_CLIENT_ID: 28190bb2-1f43-4458-8ad3-e1780d6bc352
          VITE_B2C_POLICY: susi
          VITE_B2C_DIRECTORY_ID: a0164170-e70e-42fe-98a6-e469d1a73851
          VITE_API_BASE_URL: https://onboard-back.azurewebsites.net

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request Preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: frontend
