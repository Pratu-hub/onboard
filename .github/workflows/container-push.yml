name: Container CI/CD (ACR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Student Account)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_STUDENT }}


      - name: Get ACR Name
        id: get-acr
        run: |
          # Use a secret for ACR_NAME if available, otherwise default to 'onboardin'
          ACR_NAME=${{ secrets.ACR_NAME || 'onboardin' }}
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "registry=$ACR_NAME.azurecr.io" >> $GITHUB_OUTPUT

      - name: Log in to ACR
        run: |
          az acr login --name ${{ steps.get-acr.outputs.acr_name }}

      - name: Build and Push Backend
        run: |
          docker build -t ${{ steps.get-acr.outputs.registry }}/onboard-backend:latest ./backend
          docker push ${{ steps.get-acr.outputs.registry }}/onboard-backend:latest

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ steps.get-acr.outputs.registry }}/onboard-frontend:latest ./frontend
          docker push ${{ steps.get-acr.outputs.registry }}/onboard-frontend:latest

      - name: Update Kubernetes Manifests (Optional)
        run: |
          # This step would typically use 'kubectl set image' or update the YAMLs
          # For Review II, we'll just log that the images are updated
          echo "✅ Images pushed to ${{ steps.get-acr.outputs.registry }}"
          echo "Backend: ${{ steps.get-acr.outputs.registry }}/onboard-backend:latest"
          echo "Frontend: ${{ steps.get-acr.outputs.registry }}/onboard-frontend:latest"
